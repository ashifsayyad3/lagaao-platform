version: "3.9"

# ── Shared env anchor ─────────────────────────────────────────────────────────
# Injected into every NestJS service. Override any value via root .env file.
x-nestjs-env: &nestjs-env
  NODE_ENV: production
  DATABASE_URL: mysql://${DATABASE_USER:-root}:${DATABASE_PASSWORD:-password}@mysql:3306/${DATABASE_NAME:-lagaao_db}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  lagaao-network:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mysql-data:
  redis-data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: lagaao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-password}
      MYSQL_DATABASE: ${DATABASE_NAME:-lagaao_db}
      MYSQL_USER: ${DATABASE_USER:-lagaao}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-password}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${DATABASE_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lagaao-network

  redis:
    image: redis:7-alpine
    container_name: lagaao-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lagaao-network

  # ─── Microservices ────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../..
      dockerfile: backend/services/auth-service/Dockerfile
    image: lagaao/auth-service:latest
    container_name: lagaao-auth-service
    restart: unless-stopped
    environment:
      <<: *nestjs-env
      PORT: "4001"
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
    ports:
      - "3001:4001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lagaao-network

  product-service:
    build:
      context: ../..
      dockerfile: backend/services/product-service/Dockerfile
    image: lagaao/product-service:latest
    container_name: lagaao-product-service
    restart: unless-stopped
    environment:
      <<: *nestjs-env
      PORT: "4002"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "3002:4002"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lagaao-network

  cart-service:
    build:
      context: ../..
      dockerfile: backend/services/cart-service/Dockerfile
    image: lagaao/cart-service:latest
    container_name: lagaao-cart-service
    restart: unless-stopped
    environment:
      <<: *nestjs-env
      PORT: "4003"
    ports:
      - "3003:4003"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lagaao-network

  order-service:
    build:
      context: ../..
      dockerfile: backend/services/order-service/Dockerfile
    image: lagaao/order-service:latest
    container_name: lagaao-order-service
    restart: unless-stopped
    environment:
      <<: *nestjs-env
      PORT: "4004"
    ports:
      - "3004:4004"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lagaao-network

  payment-service:
    build:
      context: ../..
      dockerfile: backend/services/payment-service/Dockerfile
    image: lagaao/payment-service:latest
    container_name: lagaao-payment-service
    restart: unless-stopped
    environment:
      <<: *nestjs-env
      PORT: "4005"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "3005:4005"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lagaao-network

  # ─── API Gateway ─────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ../..
      dockerfile: backend/api-gateway/Dockerfile
    image: lagaao/api-gateway:latest
    container_name: lagaao-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      # Container-name based service URLs (resolved inside lagaao-network)
      AUTH_SERVICE_URL:    http://auth-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      CART_SERVICE_URL:    http://cart-service:4003
      ORDER_SERVICE_URL:   http://order-service:4004
      PAYMENT_SERVICE_URL: http://payment-service:4005
    ports:
      - "${API_GATEWAY_PORT:-4000}:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lagaao-network

  # ─── Frontend ─────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the Next.js bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    image: lagaao/frontend:latest
    container_name: lagaao-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - lagaao-network
